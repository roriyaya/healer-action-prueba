name: Build de app móvil (Android/iOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  ios-verificacion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Compilar el frontend
        run: npm run build
      - name: Agregar proyecto iOS (lo regenera de cero cada vez)
        run: npx cap add ios
      - name: Sincronizar el build con el proyecto nativo
        run: npx cap sync ios
      - name: Instalar Pods (solo si el proyecto usa CocoaPods)
        run: cd ios/App && if [ -f Podfile ]; then pod install; else echo 'Swift Package Manager: no hace falta pod install'; fi
      - name: Compilar para simulador, sin firma (solo verifica que compila)
        run: cd ios/App && if [ -f Podfile ]; then DESTINO='-workspace App.xcworkspace'; else DESTINO='-project App.xcodeproj'; fi && xcodebuild $DESTINO -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO

# Prueba de la GitHub Action de Healer contra GitHub de verdad (2026-10-07).
# Usa la Action publicada (meiti-dev/healer-action@v1).
name: Healer
on: [push, workflow_dispatch]

jobs:
  healer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: healer
        uses: meiti-dev/healer-action@v1
        with:
          api-key: ${{ secrets.HEALER_API_KEY }}
          ai-level: free
          # La organización de pruebas está en el plan Free (1 app protegida), ya usada por esta app.
          app-id: e2e-roto-ts
          path: .
      - run: echo "status=${{ steps.healer.outputs.status }} reparaciones=${{ steps.healer.outputs.repairs-count }} pentagono=${{ steps.healer.outputs.pentagono-score }}"

name: 'Healer (MEITI)'
description: 'Corre el pipeline de calidad de MEITI (auditoría de código, Pentágono, reparación con IA) sobre tu repo, como paso de CI.'
author: 'MEITI'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  api-key:
    # 🩹 [BUG REAL, 2026-10-07, primera corrida en GitHub] Sin "${{ }}" en ninguna descripción: GitHub
    # evalúa las expresiones también acá y rechaza la Action entera al cargarla ("Unrecognized
    # named-value: 'secrets'"). En local no se ve, porque el runner es el que lee este archivo.
    description: 'API key de Healer. Nunca la escribas en el workflow: guárdala como GitHub Secret (por ejemplo HEALER_API_KEY) y pásala desde ahí.'
    required: true
  path:
    description: 'Carpeta a enviar (relativa al checkout). Default: todo el repo.'
    required: false
    default: '.'
  app-id:
    description: 'Identificador de esta app para Sanador — acumula historial entre corridas. Default: "<owner>/<repo>" del propio repositorio.'
    required: false
    default: ''
  app-intent:
    description: 'Descripción breve de qué hace la app (opcional, mejora la prueba de uso real si está activada).'
    required: false
    default: ''
  max-iterations:
    description: 'Tope de vueltas de reparación por corrida.'
    required: false
    default: '8'
  test-uso-real:
    description: '"true" para además correr una sesión real de uso (Puppeteer + IA) sobre la app ya reparada.'
    required: false
    default: 'false'
  start-command:
    description: 'Comando para arrancar el servidor de desarrollo (obligatorio la primera vez que se usa test-uso-real para esta app-id).'
    required: false
    default: ''
  port:
    description: 'Puerto donde ese comando sirve la app (obligatorio junto con start-command).'
    required: false
    default: ''
  ai-level:
    description: '"pro" (default) repara con las APIs pagas (Claude / Gemini Pro). "free" usa la cadena de proveedores gratis (Groq, NVIDIA y Gemini): sin costo de IA, más lento y menos preciso en código difícil.'
    required: false
    default: 'pro'
  fail-on:
    description: '"unresolved" (default) marca el paso como fallido si Sanador no pudo dejar el código limpio o si el lenguaje no está soportado (unsupported_stack). "never" nunca falla el paso — útil para correr solo informativo.'
    required: false
    default: 'unresolved'
  base-url:
    description: 'URL del servidor de Healer. Solo cambiarla para apuntar a una instancia propia.'
    required: false
    default: 'https://healer-api.meiti.dev'

outputs:
  status:
    description: '"production_ready", "unresolved" o "unsupported_stack".'
  repairs-count:
    description: 'Cantidad de parches reales aplicados.'
  pentagono-score:
    description: 'Puntaje 0-100 del Pentágono genérico.'
  app-id:
    description: 'El app-id usado — guárdalo si no lo declaraste tú, para reenvíos futuros de esta misma app.'

# Action de Node empaquetada (dist/index.mjs, con el SDK adentro): no instala nada al correr.
# Después de cambiar src/ o el SDK: npm run build, y commitear dist/.
runs:
  using: 'node24'
  main: 'dist/index.mjs'
